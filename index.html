<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="utf-8" />
  <title>Elbilskartan Sverige (Kolada N07945)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Leaflet CSS -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    #map { width: 100%; height: 100%; }

    .control-panel {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 1000;
      background: rgba(255, 255, 255, 0.95);
      padding: 10px;
      border-radius: 6px;
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
      max-width: 260px;
      font-size: 13px;
    }
    .control-panel h4 {
      margin: 0 0 6px;
      font-size: 14px;
      font-weight: 600;
    }
    .control-panel label {
      font-weight: 500;
      display: block;
      margin-top: 6px;
    }
    .control-panel input[type="text"],
    .control-panel input[type="number"] {
      width: 100%;
      box-sizing: border-box;
      padding: 4px 6px;
      margin-top: 2px;
      font-size: 13px;
    }
    .control-panel button {
      margin-top: 8px;
      padding: 5px 10px;
      font-size: 13px;
      border-radius: 4px;
      border: 1px solid #ccc;
      cursor: pointer;
      background: #f4f4f4;
    }

    .info {
      padding: 6px 8px;
      background: rgba(255, 255, 255, 0.9);
      box-shadow: 0 0 15px rgba(0,0,0,0.2);
      border-radius: 4px;
      font-size: 12px;
    }
    .info h4 {
      margin: 0 0 5px;
      font-size: 14px;
      font-weight: 600;
    }
    .legend {
      line-height: 18px;
      background: rgba(255, 255, 255, 0.9);
      padding: 6px 8px;
      border-radius: 4px;
      box-shadow: 0 0 15px rgba(0,0,0,0.2);
      font-size: 12px;
    }
    .legend i {
      width: 18px;
      height: 18px;
      float: left;
      margin-right: 4px;
      opacity: 0.8;
    }

    .source-note {
      position: absolute;
      bottom: 6px;
      left: 10px;
      z-index: 1000;
      background: rgba(255,255,255,0.85);
      padding: 3px 6px;
      border-radius: 4px;
      font-size: 11px;
    }
  </style>
</head>
<body>
  <!-- Kontrollpanel -->
  <div class="control-panel">
    <h4>Elbilskartan Sverige</h4>

    <label for="searchInput">Sök kommun eller region</label>
    <input id="searchInput" type="text" placeholder="t.ex. Tyresö eller Skåne län" />
    <button id="searchBtn">Sök</button>

    <label for="minShare">Min andel elbilar (%)</label>
    <input id="minShare" type="number" value="0" step="0.1" min="0" max="100" />

    <label for="maxShare">Max andel elbilar (%)</label>
    <input id="maxShare" type="number" value="100" step="0.1" min="0" max="100" />

    <button id="applyFilterBtn">Använd filter</button>
    <p style="margin-top:6px;">
      Dela kartan genom att kopiera adressraden – filtren sparas i länken.
    </p>
  </div>

  <div id="map"></div>
  <div class="source-note">
    Källa: Kolada (KPI N07945, API v2). Kommungränser: Sveriges dataportal.
  </div>

  <!-- Leaflet JS -->
  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>

  <script>
    // ------- Grundinställningar -------
    const KOLADA_KPI_ID = "N07945";                    // Elbilar, andel (%)
    const KOLADA_BASE_URL = "https://api.kolada.se/v2";
    const TARGET_YEAR = null;                          // sätt t.ex. 2023 om du vill låsa årtal

    const map = L.map("map").setView([62.0, 15.0], 4.5);

    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 18,
      attribution: "&copy; OpenStreetMap contributors",
    }).addTo(map);

    // ------- Färgskala -------
    function getColor(d) {
      return d > 40 ? "#08306b" :
             d > 30 ? "#08519c" :
             d > 20 ? "#2171b5" :
             d > 15 ? "#4292c6" :
             d > 10 ? "#6baed6" :
             d > 5  ? "#9ecae1" :
             d > 1  ? "#c6dbef" :
             d > 0  ? "#deebf7" :
                      "#f7fbff";
    }

    function style(feature) {
      const share = feature.properties.ev_share || 0;
      return {
        fillColor: getColor(share),
        weight: 1,
        opacity: 1,
        color: "white",
        dashArray: "3",
        fillOpacity: 0.8,
      };
    }

    // ------- Hjälpfunktioner för GeoJSON -------
    function getKommunNamn(props) {
      return props.kom_namn || "";
    }

    function getRegionNamn(props) {
      const mapping = {
        "01": "Stockholms län",
        "03": "Uppsala län",
        "04": "Södermanlands län",
        "05": "Östergötlands län",
        "06": "Jönköpings län",
        "07": "Kronobergs län",
        "08": "Kalmar län",
        "09": "Gotlands län",
        "10": "Blekinge län",
        "12": "Skåne län",
        "13": "Hallands län",
        "14": "Västra Götalands län",
        "17": "Värmlands län",
        "18": "Örebro län",
        "19": "Västmanlands län",
        "20": "Dalarnas län",
        "21": "Gävleborgs län",
        "22": "Västernorrlands län",
        "23": "Jämtlands län",
        "24": "Västerbottens län",
        "25": "Norrbottens län",
      };
      const code = props.lan_code;
      return mapping[code] || "";
    }

    function getKommunKod(props) {
      // I din GeoJSON ligger kommunkoden redan i id, t.ex. "0180"
      return String(props.id);
    }

    // ------- Info-ruta -------
    const info = L.control();

    info.onAdd = function () {
      this._div = L.DomUtil.create("div", "info");
      this.update();
      return this._div;
    };

    info.update = function (props) {
      if (!props) {
        this._div.innerHTML =
          "<h4>Andel elbilar</h4>Håll musen över en kommun";
      } else {
        const name = getKommunNamn(props);
        const region = getRegionNamn(props);
        const share = (props.ev_share ?? 0).toFixed(1);
        this._div.innerHTML =
          "<h4>Andel elbilar</h4>" +
          name +
          (region ? ", " + region : "") +
          "<br/><b>" +
          share +
          " %</b>";
      }
    };

    info.addTo(map);

    // ------- Legend -------
    const legend = L.control({ position: "bottomright" });

    legend.onAdd = function () {
      const div = L.DomUtil.create("div", "legend");
      const grades = [0, 1, 5, 10, 15, 20, 30, 40];
      const labels = [];

      for (let i = 0; i < grades.length; i++) {
        const from = grades[i];
        const to = grades[i + 1];
        labels.push(
          '<i style="background:' +
            getColor(from + 0.01) +
            '"></i> ' +
            from +
            (to ? "&ndash;" + to : "+") +
            " %"
        );
      }

      div.innerHTML = labels.join("<br>");
      return div;
    };

    legend.addTo(map);

    // ------- Filtertillstånd -------
    let allFeatures = [];
    let geoLayer = null;

    let currentRegion = null;
    let minShare = 0;
    let maxShare = 100;

    function loadStateFromUrl() {
      const params = new URLSearchParams(window.location.search);
      const regionFromUrl = params.get("region");
      const minFromUrl = parseFloat(params.get("min"));
      const maxFromUrl = parseFloat(params.get("max"));

      if (regionFromUrl) {
        currentRegion = regionFromUrl;
        document.getElementById("searchInput").value = regionFromUrl;
      }
      if (!isNaN(minFromUrl)) {
        minShare = minFromUrl;
        document.getElementById("minShare").value = minFromUrl;
      }
      if (!isNaN(maxFromUrl)) {
        maxShare = maxFromUrl;
        document.getElementById("maxShare").value = maxFromUrl;
      }
    }

    function updateUrl() {
      const params = new URLSearchParams();
      if (currentRegion) params.set("region", currentRegion);
      if (minShare !== 0) params.set("min", minShare);
      if (maxShare !== 100) params.set("max", maxShare);
      const newUrl =
        window.location.pathname +
        (params.toString() ? "?" + params.toString() : "");
      history.replaceState(null, "", newUrl);
    }

    function featurePassesFilters(feature) {
      const props = feature.properties;
      const regionName = getRegionNamn(props);
      const share = props.ev_share || 0;

      if (
        currentRegion &&
        regionName.toLowerCase() !== currentRegion.toLowerCase()
      ) {
        return false;
      }
      if (share < minShare || share > maxShare) {
        return false;
      }
      return true;
    }

    function renderLayer() {
      if (!allFeatures.length) return;

      const filtered = allFeatures.filter(featurePassesFilters);

      if (geoLayer) {
        geoLayer.remove();
      }

      geoLayer = L.geoJSON(filtered, {
        style: style,
        onEachFeature: function (feature, layer) {
          const props = feature.properties;
          const name = getKommunNamn(props);
          const region = getRegionNamn(props);
          const share = (props.ev_share ?? 0).toFixed(1);
          const popupHtml =
            "<strong>" +
            name +
            "</strong>" +
            (region ? "<br>" + region : "") +
            "<br>Andel elbilar: " +
            share +
            " %";

          layer.bindPopup(popupHtml);

          layer.on({
            mouseover: function (e) {
              const target = e.target;
              target.setStyle({
                weight: 2,
                color: "#666",
                dashArray: "",
                fillOpacity: 0.9,
              });
              if (!L.Browser.ie && !L.Browser.opera && !L.Browser.edge) {
                target.bringToFront();
              }
              info.update(target.feature.properties);
            },
            mouseout: function (e) {
              geoLayer.resetStyle(e.target);
              info.update();
            },
            click: function (e) {
              e.target.openPopup();
            },
          });
        },
      }).addTo(map);

      if (filtered.length) {
        map.fitBounds(geoLayer.getBounds());
      }
    }

    // ------- Sökning (kommun/region) -------
    function handleSearch() {
      const query = document
        .getElementById("searchInput")
        .value.trim()
        .toLowerCase();
      if (!query || !allFeatures.length) return;

      // 1. Kommun
      const kommunFeature = allFeatures.find((f) =>
        getKommunNamn(f.properties).toLowerCase() === query
      );

      if (kommunFeature && geoLayer) {
        const layer = geoLayer.getLayers().find(
          (l) =>
            getKommunNamn(l.feature.properties).toLowerCase() === query
        );
        if (layer) {
          map.fitBounds(layer.getBounds());
          layer.openPopup();
          info.update(layer.feature.properties);
          return;
        }
      }

      // 2. Region
      const regionFeature = allFeatures.find((f) =>
        getRegionNamn(f.properties).toLowerCase() === query
      );

      if (regionFeature) {
        currentRegion = getRegionNamn(regionFeature.properties);
        updateUrl();
        renderLayer();
        return;
      }

      alert("Hittade ingen kommun eller region med namnet: " + query);
    }

    function handleFilterChange() {
      const minInput = parseFloat(
        document.getElementById("minShare").value
      );
      const maxInput = parseFloat(
        document.getElementById("maxShare").value
      );

      minShare = isNaN(minInput) ? 0 : Math.max(0, Math.min(100, minInput));
      maxShare = isNaN(maxInput)
        ? 100
        : Math.max(0, Math.min(100, maxInput));

      if (minShare > maxShare) {
        const tmp = minShare;
        minShare = maxShare;
        maxShare = tmp;
      }

      updateUrl();
      renderLayer();
    }

    document
      .getElementById("searchBtn")
      .addEventListener("click", handleSearch);
    document
      .getElementById("searchInput")
      .addEventListener("keydown", (e) => {
        if (e.key === "Enter") handleSearch();
      });
    document
      .getElementById("applyFilterBtn")
      .addEventListener("click", handleFilterChange);

    // ------- Kolada v2: tolka svar -------

    function getLatestValueFromKoladaResponse(data) {
      // v2-data: { values: [ {kpi, municipality, period, values:[{count,gender,status,value}]} ] }
      if (!data || !Array.isArray(data.values)) return null;

      let best = null;

      data.values.forEach((row) => {
        const period = parseInt(row.period, 10);
        if (TARGET_YEAR && period !== TARGET_YEAR) return;

        const vals = Array.isArray(row.values) ? row.values : [];
        if (!vals.length) return;

        // Välj kön = T om det finns, annars första
        const v = vals.find((x) => x.gender === "T") || vals[0];
        if (!v || v.value === null || v.value === undefined) return;

        const value = Number(v.value);
        if (isNaN(value)) return;

        if (!best || (!isNaN(period) && period > best.year)) {
          best = { year: period, value };
        }
      });

      // Om vi låste årtal och inte hittade något, gör en andra pass utan årfilter
      if (!best && TARGET_YEAR) {
        data.values.forEach((row) => {
          const period = parseInt(row.period, 10);
          const vals = Array.isArray(row.values) ? row.values : [];
          if (!vals.length) return;
          const v = vals.find((x) => x.gender === "T") || vals[0];
          if (!v || v.value === null || v.value === undefined) return;
          const value = Number(v.value);
          if (isNaN(value)) return;
          if (!best || (!isNaN(period) && period > best.year)) {
            best = { year: period, value };
          }
        });
      }

      return best;
    }

    async function fetchKoladaForMunicipality(code) {
      // /v2/data/kpi/<KPI>/municipality/<MUNICIPALITY_ID>
      const url = `${KOLADA_BASE_URL}/data/kpi/${encodeURIComponent(
        KOLADA_KPI_ID
      )}/municipality/${encodeURIComponent(code)}`;

      try {
        const resp = await fetch(url);
        if (!resp.ok) {
          console.warn("Kolada fel för kommun", code, resp.status);
          return null;
        }
        const data = await resp.json();
        return getLatestValueFromKoladaResponse(data);
      } catch (err) {
        console.error("Fel vid hämtning från Kolada för kommun", code, err);
        return null;
      }
    }

    async function injectKoladaDataIntoGeojson(geojson) {
      const features = geojson.features || [];
      const codes = [...new Set(features.map((f) => getKommunKod(f.properties)))];

      const results = {};

      await Promise.all(
        codes.map(async (code) => {
          if (!code) return;
          const res = await fetchKoladaForMunicipality(code);
          if (res && !isNaN(res.value)) {
            results[code] = res;
          }
        })
      );

      features.forEach((feat) => {
        const props = feat.properties;
        const code = getKommunKod(props);
        const match = results[code];

        if (match) {
          props.ev_share = match.value;
        } else {
          props.ev_share = 0;
        }
      });

      return geojson;
    }

    // ------- Init -------
    loadStateFromUrl();

    (async function init() {
      try {
        const geoResp = await fetch("kommuner.geojson");
        if (!geoResp.ok) {
          alert("Kunde inte läsa kommuner.geojson");
          return;
        }
        const geojson = await geoResp.json();
        const enriched = await injectKoladaDataIntoGeojson(geojson);
        allFeatures = enriched.features;
        renderLayer();
      } catch (err) {
        console.error("Fel vid inläsning/injektion:", err);
        alert(
          "Fel vid inläsning av data. Öppna utvecklarkonsolen (F12) för detaljer."
        );
      }
    })();
  </script>
</body>
</html>
