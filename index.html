<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Elbilskartan Sverige</title>

<!-- Leaflet CSS -->
<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
  }

  #map {
    width: 100%;
    height: 80vh;
  }

  .panel {
    background: white;
    padding: 16px;
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    max-width: 500px;
    margin: 12px;
  }

  .search-container input {
    width: 100%;
    padding: 10px;
    border: 1px solid #aaa;
    border-radius: 6px;
    margin-bottom: 8px;
    font-size: 16px;
  }

  button {
    padding: 10px 16px;
    background: #2563eb;
    color: white;
    border: none;
    border-radius: 6px;
    font-size: 16px;
    cursor: pointer;
  }

  button:hover {
    background: #1e4fbb;
  }

  /* Autocomplete dropdown */
  #autocomplete-list {
    position: absolute;
    background: white;
    border: 1px solid #ccc;
    width: calc(100% - 50px);
    z-index: 9999;
    max-height: 200px;
    overflow-y: auto;
    border-radius: 6px;
  }

  #autocomplete-list div {
    padding: 8px;
    cursor: pointer;
  }

  #autocomplete-list div:hover {
    background: #eee;
  }

  /* Sliders */
  .slider-container {
    margin-top: 12px;
  }

  .slider-container label {
    display: block;
    font-weight: bold;
    margin-bottom: 6px;
  }

  .slider-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  input[type="range"] {
    width: 70%;
  }

  /* Zoom-knappar nere till höger */
  .leaflet-control-zoom {
    position: absolute !important;
    right: 10px !important;
    bottom: 40px !important;
    top: auto !important;
    left: auto !important;
    z-index: 500 !important;
  }

  @media (max-width: 768px) {
    .leaflet-control-zoom {
      bottom: 70px !important;
    }
  }

  /* Flytta ner “Andel elbilar”-infoboxen i mobilvy */
  @media (max-width: 768px) {
    .leaflet-top.leaflet-right {
      top: 140px !important;
      right: 10px !important;
    }
  }

</style>
</head>

<body>

<div class="panel">
  <h2>Elbilskartan Sverige</h2>

  <label for="search">Sök kommun</label>
  <div class="search-container">
    <input id="search" type="text" placeholder="t.ex. Solna" autocomplete="off">
    <div id="autocomplete-list"></div>
  </div>

  <button id="searchBtn">Sök</button>

  <div class="slider-container">
    <label>Andel elbilar (%)</label>

    <div class="slider-row">
      <span>Min</span>
      <input type="range" id="minSlider" min="0" max="100" value="0">
      <span id="minVal">0%</span>
    </div>

    <div class="slider-row">
      <span>Max</span>
      <input type="range" id="maxSlider" min="0" max="100" value="100">
      <span id="maxVal">100%</span>
    </div>
  </div>

  <p>Klicka på en kommun för att se mer information och dela en länk till just den kommunen.</p>
</div>

<div id="map"></div>

<p style="text-align:center; font-size:14px; margin-top:10px;">
  Källa: Kolada (KPI N07945, API v2).<br>
  Kommungränser: Sveriges dataportal.
</p>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
/* =======================
   START SCRIPT
   ======================= */

let map = L.map('map').setView([62.0, 15.0], 5);
let geojsonLayer;
let kommunData = {};
let kommuner = [];

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 18,
}).addTo(map);


/* =======================
   LADDA KOMMUNGRÄNSER
   ======================= */

fetch("kommuner.geojson")
  .then(r => r.json())
  .then(data => {
    kommuner = data.features.map(f => ({
      namn: f.properties.name,
      kod: f.id
    }));

    geojsonLayer = L.geoJSON(data, {
      style: feature => ({
        color: "#555",
        weight: 1,
        fillOpacity: 0.7,
        fillColor: getColor(0)
      }),
      onEachFeature: onEachFeature
    }).addTo(map);

    fetchKoladaData();
  });


/* =======================
   HÄMTA KOLADA-DATA
   ======================= */

function fetchKoladaData() {
  fetch("https://api.kolada.se/v2/data/kpi/N07945")
    .then(r => r.json())
    .then(json => {
      json.values.forEach(v => {
        const kod = v.municipality;
        const ar = Number(v.period);
        const varde = Number(v.value);
        const kon = v.gender;

        if (kon === "T") {
          if (!kommunData[kod] || kommunData[kod].ar < ar) {
            kommunData[kod] = {
              varde: varde,
              ar: ar
            };
          }
        }
      });

      updateMapColors();
    });
}


/* =======================
   FÄRGER
   ======================= */
function getColor(val) {
  return val > 30 ? "#08306b" :
         val > 20 ? "#2171b5" :
         val > 15 ? "#4292c6" :
         val > 10 ? "#6baed6" :
         val > 5  ? "#9ecae1" :
                    "#c6dbef";
}


/* =======================
   RITA OCH UPPDATERA
   ======================= */

function updateMapColors() {
  geojsonLayer.eachLayer(layer => {
    const kod = layer.feature.id;
    const data = kommunData[kod];

    const val = data ? data.varde : 0;

    layer.setStyle({
      fillColor: getColor(val)
    });
  });
}


/* =======================
   POPUP OCH INTERAKTION
   ======================= */

function onEachFeature(feature, layer) {
  layer.on("click", () => {
    const kod = feature.id;
    const namn = feature.properties.name;
    const data = kommunData[kod];
    const varde = data ? data.varde : 0;

    const link = `${window.location.origin}${window.location.pathname}?kommun=${kod}`;

    const popupHtml = `
      <b>${namn}</b><br>
      Andel elbilar: ${varde.toFixed(1)} %<br><br>
      <button onclick="shareLink('${namn}', '${link}')">Dela</button>
    `;

    layer.bindPopup(popupHtml).openPopup();
  });

  layer.on("mouseover", () => {
    const kod = feature.id;
    const namn = feature.properties.name;
    const data = kommunData[kod];
    const varde = data ? data.varde : 0;

    info.update(namn, varde);
  });

  layer.on("mouseout", () => {
    info.update();
  });
}


/* =======================
   INFOKONTROLL
   ======================= */

const info = L.control({position: "topright"});

info.onAdd = function () {
  this._div = L.DomUtil.create("div", "info");
  this._div.style.background = "white";
  this._div.style.padding = "8px 12px";
  this._div.style.borderRadius = "8px";
  this._div.style.boxShadow = "0 2px 6px rgba(0,0,0,0.2)";
  this.update();
  return this._div;
};

info.update = function (namn, varde) {
  this._div.innerHTML = `<b>Andel elbilar</b><br>${
    namn ? `${namn}: ${varde.toFixed(1)} %` : "Håll musen över en kommun"
  }`;
};

info.addTo(map);


/* =======================
   DELNING
   ======================= */

function shareLink(kommun, link) {
  if (navigator.share) {
    navigator.share({
      title: `Andel elbilar i ${kommun}`,
      text: `Elbilskartan Sverige – ${kommun}`,
      url: link
    });
  } else {
    navigator.clipboard.writeText(link);
    alert("Länk kopierad:\n" + link);
  }
}


/* =======================
   AUTOCOMPLETE
   ======================= */

const searchInput = document.getElementById("search");
const list = document.getElementById("autocomplete-list");

searchInput.addEventListener("input", () => {
  const val = searchInput.value.toLowerCase();
  list.innerHTML = "";

  if (!val) return;

  kommuner
    .filter(k => k.namn.toLowerCase().includes(val))
    .forEach(k => {
      const div = document.createElement("div");
      div.textContent = k.namn;
      div.onclick = () => {
        searchInput.value = k.namn;
        list.innerHTML = "";
        zoomToKommun(k.kod);
      };
      list.appendChild(div);
    });
});


/* =======================
   ZOOMA TILL KOMMUN
   ======================= */

function zoomToKommun(kod) {
  geojsonLayer.eachLayer(layer => {
    if (layer.feature.id === kod) {
      map.fitBounds(layer.getBounds(), {maxZoom: 10});
      layer.fire("click");
    }
  });
}


/* =======================
   SÖK-KNAPP
   ======================= */

document.getElementById("searchBtn").addEventListener("click", () => {
  const namn = searchInput.value.trim().toLowerCase();
  const match = kommuner.find(k => k.namn.toLowerCase() === namn);
  if (match) zoomToKommun(match.kod);
});


/* =======================
   URL-PARAMETRAR
   ======================= */

const params = new URLSearchParams(window.location.search);
if (params.has("kommun")) {
  zoomToKommun(params.get("kommun"));
}


/* =======================
   SLIDERS
   ======================= */

const minSlider = document.getElementById("minSlider");
const maxSlider = document.getElementById("maxSlider");
const minVal = document.getElementById("minVal");
const maxVal = document.getElementById("maxVal");

minSlider.oninput = () => {
  if (Number(minSlider.value) > Number(maxSlider.value)) {
    maxSlider.value = minSlider.value;
  }
  minVal.textContent = minSlider.value + "%";
  updateMapColors();
};

maxSlider.oninput = () => {
  if (Number(maxSlider.value) < Number(minSlider.value)) {
    minSlider.value = maxSlider.value;
  }
  maxVal.textContent = maxSlider.value + "%";
  updateMapColors();
};

/* =======================
   END
   ======================= */
</script>

</body>
</html>
