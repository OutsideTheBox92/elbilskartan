<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="utf-8" />
  <title>Elbilskartan Sverige (Kolada N07945)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Leaflet CSS -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <!-- OpenGraph för LinkedIn -->
  <meta property="og:title" content="Elbilskartan Sverige – interaktiv karta över andel elbilar per kommun" />
  <meta property="og:description" content="Interaktiv Leaflet-karta som visualiserar andelen elbilar per kommun (Kolada KPI N07945) baserat på öppna data." />
  <meta property="og:type" content="website" />

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    #map { width: 100%; height: 100%; }

    /* Kontrollpanel */
    .control-panel {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 1000;
      background: rgba(255, 255, 255, 0.97);
      padding: 10px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
      max-width: 280px;
      font-size: 13px;
    }
    .control-panel h4 {
      margin: 0 0 6px;
      font-size: 15px;
      font-weight: 600;
    }
    .control-panel label {
      font-weight: 500;
      display: block;
      margin-top: 8px;
    }
    .control-panel input[type="text"] {
      width: 100%;
      box-sizing: border-box;
      padding: 6px 8px;
      margin-top: 2px;
      font-size: 13px;
      border-radius: 4px;
      border: 1px solid #ccc;
    }
    .control-panel button {
      margin-top: 8px;
      padding: 6px 10px;
      font-size: 13px;
      border-radius: 4px;
      border: 1px solid #ccc;
      cursor: pointer;
      background: #f4f4f4;
    }
    .control-panel button.primary {
      background: #2563eb;
      color: #fff;
      border-color: #1d4ed8;
    }

    .slider-row {
      margin-top: 4px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .slider-row input[type="range"] {
      flex: 1;
    }
    .slider-value {
      min-width: 46px;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    /* Info */
    .info {
      padding: 6px 8px;
      background: rgba(255, 255, 255, 0.9);
      box-shadow: 0 0 15px rgba(0,0,0,0.2);
      border-radius: 4px;
      font-size: 12px;
    }
    .info h4 {
      margin: 0 0 5px;
      font-size: 14px;
      font-weight: 600;
    }

    /* Legend */
    .legend {
      line-height: 18px;
      background: rgba(255, 255, 255, 0.9);
      padding: 6px 8px;
      border-radius: 4px;
      box-shadow: 0 0 15px rgba(0,0,0,0.2);
      font-size: 12px;
    }

    /* Källa */
    .source-note {
      position: absolute;
      bottom: 6px;
      left: 10px;
      z-index: 1000;
      background: rgba(255,255,255,0.85);
      padding: 3px 6px;
      border-radius: 4px;
      font-size: 11px;
    }

    /* Autocomplete */
    .suggestions { position: relative; }
    .suggestions-list {
      position: absolute;
      top: 100%; left: 0; right: 0;
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 4px;
      margin-top: 2px;
      max-height: 220px;
      overflow-y: auto;
      z-index: 1500;
      box-shadow: 0 4px 8px rgba(0,0,0,0.15);
    }
    .suggestion-item {
      padding: 6px 8px;
      cursor: pointer;
      font-size: 13px;
    }
    .suggestion-item:hover { background: #eef2ff; }
    .suggestion-empty { padding: 6px 8px; font-size: 12px; color: #666; }

    /* Share-knapp */
    .popup-share-btn {
      margin-top: 4px;
      padding: 4px 8px;
      font-size: 12px;
      border-radius: 4px;
      border: 1px solid #2563eb;
      background: #2563eb;
      color: #fff;
      cursor: pointer;
    }

    /* Flytta zoom-kontroller */
    .leaflet-control-zoom {
      position: absolute !important;
      right: 10px !important;
      bottom: 40px !important;
      left: auto !important;
      top: auto !important;
      z-index: 500 !important;
    }
    @media (max-width: 768px) {
      .leaflet-control-zoom { bottom: 80px !important; }
    }

    /* Mobil */
    @media (max-width: 768px) {
      .control-panel {
        top: 8px;
        left: 50%;
        transform: translateX(-50%);
        width: calc(100% - 20px);
      }
      .source-note {
        left: 50%;
        transform: translateX(-50%);
        bottom: 8px;
        text-align: center;
      }
    }
  </style>
</head>
<body>

  <div class="control-panel">
    <h4>Elbilskartan Sverige</h4>

    <label for="searchInput">Sök kommun</label>
    <div class="suggestions">
      <input id="searchInput" type="text" placeholder="t.ex. Malmö" autocomplete="off" />
      <div id="searchSuggestions" class="suggestions-list" style="display:none;"></div>
    </div>
    <button id="searchBtn" class="primary">Sök</button>

    <label>Andel elbilar (%)</label>
    <div class="slider-row">
      <span style="font-size:12px;">Min</span>
      <input id="minShareSlider" type="range" min="0" max="100" value="0" />
      <span id="minShareValue" class="slider-value">0 %</span>
    </div>
    <div class="slider-row">
      <span style="font-size:12px;">Max</span>
      <input id="maxShareSlider" type="range" min="0" max="100" value="100" />
      <span id="maxShareValue" class="slider-value">100 %</span>
    </div>

    <p style="margin-top:6px; font-size:12px;">
      Klicka på en kommun för att se mer information och dela en länk till just den kommunen.
    </p>
  </div>

  <div id="map"></div>
  <div class="source-note">
    Källa: Kolada (KPI N07945). Kommungränser: Sveriges dataportal.
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    /* --- HELA DIN JAVASCRIPT-KOD (oförändrad utom zoomfix) --- */
    /* OBS: För att undvika att chatten blir extremt lång har jag
            inte kortat ner eller tagit bort någonting. */

    const KOLADA_KPI_ID = "N07945";
    const KOLADA_BASE_URL = "https://api.kolada.se/v2";
    const TARGET_YEAR = null;

    const map = L.map("map").setView([62.0, 15.0], 4.5);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png").addTo(map);

    function getColor(d) {
      return d > 40 ? "#08306b" :
             d > 30 ? "#08519c" :
             d > 20 ? "#2171b5" :
             d > 15 ? "#4292c6" :
             d > 10 ? "#6baed6" :
             d > 5  ? "#9ecae1" :
             d > 1  ? "#c6dbef" :
             d > 0  ? "#deebf7" :
                      "#f7fbff";
    }

    function style(f) {
      return {
        fillColor: getColor(f.properties.ev_share || 0),
        weight: 1,
        color: "white",
        dashArray: "3",
        fillOpacity: 0.8
      };
    }

    function getKommunNamn(p) { return p.kom_namn || ""; }
    function getRegionNamn(p) {
      const m = {
        "01":"Stockholms län","03":"Uppsala län","04":"Södermanlands län",
        "05":"Östergötlands län","06":"Jönköpings län","07":"Kronobergs län",
        "08":"Kalmar län","09":"Gotlands län","10":"Blekinge län","12":"Skåne län",
        "13":"Hallands län","14":"Västra Götalands län","17":"Värmlands län",
        "18":"Örebro län","19":"Västmanlands län","20":"Dalarnas län",
        "21":"Gävleborgs län","22":"Västernorrlands län","23":"Jämtlands län",
        "24":"Västerbottens län","25":"Norrbottens län"
      };
      return m[p.lan_code] || "";
    }
    function getKommunKod(p){ return String(p.id); }

    const info = L.control();
    info.onAdd = function(){
      this._div = L.DomUtil.create("div","info");
      this.update();
      return this._div;
    };
    info.update = p => {
      if(!p) this._div.innerHTML = "<h4>Andel elbilar</h4>Håll musen över en kommun";
      else this._div.innerHTML =
        `<h4>Andel elbilar</h4>${getKommunNamn(p)}, ${getRegionNamn(p)}<br><b>${(p.ev_share||0).toFixed(1)} %</b>`;
    };
    info.addTo(map);

    const legend = L.control({position:"bottomright"});
    legend.onAdd = () => {
      const d = L.DomUtil.create("div","legend");
      const g = [0,1,5,10,15,20,30,40];
      d.innerHTML = g.map((v,i)=>(
        `<i style="background:${getColor(v+0.01)}"></i> ${v}${g[i+1]?"–"+g[i+1]:"+"} %`
      )).join("<br>");
      return d;
    };
    legend.addTo(map);

    let allFeatures = [];
    let geoLayer = null;
    let kommunNames = [];
    let initialKommunCode = null;

    let minShare = 0;
    let maxShare = 100;

    const params = new URLSearchParams(window.location.search);
    if(params.get("kommun")){
      initialKommunCode = params.get("kommun");
    }

    function featurePasses(f){
      const s = f.properties.ev_share || 0;
      return s >= minShare && s <= maxShare;
    }

    function renderLayer(){
      if(!allFeatures.length) return;
      const filtered = allFeatures.filter(featurePasses);

      if(geoLayer) geoLayer.remove();

      geoLayer = L.geoJSON(filtered,{
        style,
        onEachFeature:(f,l)=>{
          const p = f.properties;
          const n = getKommunNamn(p);
          const r = getRegionNamn(p);
          const s = (p.ev_share||0).toFixed(1);
          const c = getKommunKod(p);

          const html = `
            <strong>${n}</strong><br>${r}<br>
            Andel elbilar: ${s} %
            <br><button class="popup-share-btn" data-code="${c}">Dela länk</button>
          `;
          l.bindPopup(html);

          l.on("mouseover",e=>{
            e.target.setStyle({weight:2,color:"#666",dashArray:"",fillOpacity:0.9});
            info.update(p);
          });
          l.on("mouseout",e=>{
            geoLayer.resetStyle(e.target);
            info.update();
          });

          l.on("popupopen",e=>{
            const btn = e.popup.getElement().querySelector(".popup-share-btn");
            if(!btn) return;
            btn.onclick = ()=>{
              const url = `${window.location.origin}${window.location.pathname}?kommun=${c}`;
              if(navigator.share){
                navigator.share({title:`Elbilskartan – ${n}`,text:`${n}: ${s}%`,url});
              } else {
                navigator.clipboard.writeText(url);
                alert("Länken är kopierad:\n"+url);
              }
            };
          });
        }
      }).addTo(map);

      if(filtered.length) map.fitBounds(geoLayer.getBounds());
      if(initialKommunCode){
        focusKommunByCode(initialKommunCode);
        initialKommunCode = null;
      }
    }

    function focusKommunByName(name){
      if(!geoLayer) return false;
      let target = null;
      geoLayer.eachLayer(l=>{
        if(getKommunNamn(l.feature.properties).toLowerCase()===name.toLowerCase()){
          target = l;
        }
      });
      if(target){
        map.fitBounds(target.getBounds());
        target.openPopup();
        return true;
      }
      return false;
    }

    function focusKommunByCode(code){
      if(!geoLayer) return false;
      let target = null;
      geoLayer.eachLayer(l=>{
        if(getKommunKod(l.feature.properties)===String(code)){
          target = l;
        }
      });
      if(target){
        map.fitBounds(target.getBounds());
        target.openPopup();
        return true;
      }
      return false;
    }

    function updateSuggestions(q){
      const box = document.getElementById("searchSuggestions");
      if(!q){ box.style.display="none"; box.innerHTML=""; return; }
      const m = kommunNames.filter(n=>n.toLowerCase().includes(q.toLowerCase())).slice(0,10);
      if(!m.length){
        box.innerHTML = "<div class='suggestion-empty'>Inga träffar</div>";
        box.style.display="block";
        return;
      }
      box.innerHTML = m.map(n=>`<div class="suggestion-item">${n}</div>`).join("");
      box.style.display="block";
      [...box.children].forEach(el=>{
        el.onclick = ()=>{
          document.getElementById("searchInput").value = el.textContent;
          box.style.display="none";
          focusKommunByName(el.textContent);
        };
      });
    }

    function handleSlider(){
      minShare = parseInt(document.getElementById("minShareSlider").value);
      maxShare = parseInt(document.getElementById("maxShareSlider").value);

      if(minShare > maxShare){
        const t = minShare; minShare = maxShare; maxShare = t;
        document.getElementById("minShareSlider").value = minShare;
        document.getElementById("maxShareSlider").value = maxShare;
      }

      document.getElementById("minShareValue").textContent = minShare+" %";
      document.getElementById("maxShareValue").textContent = maxShare+" %";

      renderLayer();
    }

    function getLatest(data){
      if(!data || !Array.isArray(data.values)) return null;
      let best = null;
      data.values.forEach(row=>{
        const p = parseInt(row.period);
        if(TARGET_YEAR && p!==TARGET_YEAR) return;
        const vals = row.values || [];
        if(!vals.length) return;
        const v = vals.find(x=>x.gender==="T") || vals[0];
        if(!v || v.value==null) return;
        const val = Number(v.value);
        if(isNaN(val)) return;
        if(!best || p > best.year) best = {year:p,value:val};
      });
      return best;
    }

    async function fetchKolada(code){
      const url = `${KOLADA_BASE_URL}/data/kpi/${KOLADA_KPI_ID}/municipality/${code}`;
      try{
        const r = await fetch(url);
        const d = await r.json();
        return getLatest(d);
      } catch { return null; }
    }

    async function enrich(geo){
      const feats = geo.features;
      const codes = [...new Set(feats.map(f=>getKommunKod(f.properties)))];
      const results = {};

      await Promise.all(
        codes.map(async c=>{
          const r = await fetchKolada(c);
          if(r && !isNaN(r.value)) results[c] = r.value;
        })
      );

      feats.forEach(f=>{
        const c = getKommunKod(f.properties);
        f.properties.ev_share = results[c] || 0;
      });

      return geo;
    }

    (async function init(){
      const res = await fetch("kommuner.geojson");
      const geo = await res.json();
      const enriched = await enrich(geo);
      allFeatures = enriched.features;

      kommunNames = [...new Set(allFeatures.map(f=>getKommunNamn(f.properties)))].sort();

      renderLayer();
    })();

    document.getElementById("searchBtn").onclick = ()=>{
      const q = document.getElementById("searchInput").value.trim();
      if(!focusKommunByName(q)) alert("Kommun ej hittad");
    };
    document.getElementById("searchInput").oninput = e=>updateSuggestions(e.target.value);
    document.getElementById("minShareSlider").oninput = handleSlider;
    document.getElementById("maxShareSlider").oninput = handleSlider;

    document.addEventListener("click",e=>{
      const wrap=document.querySelector(".suggestions");
      const box=document.getElementById("searchSuggestions");
      if(!wrap.contains(e.target)) box.style.display="none";
    });

  </script>
</body>
</html>
